<!doctype html>
<!--
  H1 — HİKAYE (1080 × 1920)
  Üst ve alt 250 px arayüz tarafından kapanabilir; kritik metin ve karekod
  bu bantlara girmez (docs/marka-kimligi.md §8.4).

  Hikaye tek bir şey söyler. İkinci bir fikir eklenmez — kaydırılıp geçilir.
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ortak.css">
</head>
<body>
<div class="tuval hikaye {{zemin}} {{uzeri}}">
  {{foto}}

  <div class="icerik orta">
    <!--#if etiket-->
    <p class="ust-etiket">{{etiket}}</p>
    <!--#endif-->
    <h1 class="display" style="font-size:78px">{{baslik}}</h1>
    <!--#if altmetin-->
    <p class="lead">{{altmetin}}</p>
    <!--#endif-->

    <!--#if satirlar-->
    <dl class="satirlar">{{satirlar}}</dl>
    <!--#endif-->

    <div class="kartela" style="margin-block-start:20px">
      <span class="k1"></span><span class="k2"></span><span class="k3"></span><span class="k4"></span>
    </div>

    <!--#if eylem-->
    <p class="govde" style="font-weight:600;margin-block-start:14px">{{eylem}}</p>
    <!--#endif-->
  </div>

  <div class="altbar">
    <div class="logo">
      <span class="logo-yazi">KARTELA</span>
      <span class="logo-ruhsat">{{ruhsat_adi}}</span>
    </div>
    {{karekod}}
  </div>

</div>
</body>
</html>
